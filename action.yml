# yamllint disable rule:line-length
# yamllint disable rule:quoted-strings
---
name: MCVS-docker-action
description: |
  Mission Critical Vulnerability Scanner (MCVS) Docker action.
inputs:
  build-args:
    description: |
      Docker build arguments. Passed as-is if multiline, else formatted as
      `APPLICATION=value`.
  context:
    default: "."
    description: |
      Directory path that contains all the files needed to build a Docker image.
  dockle-accept-key:
    description: |
      One of the Dockle checks is the inspection of use of secrets in
      environment variables. Currently, there is a reported bug
      `goodwithtech/dockle/issues/250`, i.e. if a specific version of a package
      will be installed then an error will be thrown by Dockle, which is
      incorrect. To mitigate this one has to specify the packages that are
      applicable, e.g.: `libcrypto3,libssl3`.
  grype-version:
    description: The grype version to be used by the anchore/scan-action.
  images:
    description: The name of the to be created image.
    default: ghcr.io/${{ github.repository }}
  dockerhub-username:
    description: |
      Docker Hub username. Required when push-to-container-registry is set to
      'dockerhub'.
  dockerhub-token:
    description: |
      Docker Hub access token. Required when push-to-container-registry is set
      to 'dockerhub'.
  platforms:
    description: |
      Comma separated list of target platforms to build the image for, e.g.
      `linux/amd64,linux/arm64`. Set the value to `linux/amd64` to restore
      single architecture builds. One platform is scanned per job, i.e.
      `linux/amd64` when it is in the list, else the first entry.
    default: linux/amd64,linux/arm64
  push-to-container-registry:
    description: |
      Specify the container registry to which the image must be pushed. Set the
      value to: 'ghcr' for GitHub Container Registry, 'dockerhub' for Docker
      Hub, or '' to disable pushing to a container registry.
    default: ghcr
  token:
    description: |
      A token is required to allow the mcvs-docker-action to push the
      image that it has been built, to the packages repository of the GitHub
      repository where the action has been run.
runs:
  using: "composite"
  steps:
    #
    # Dockerfile linting (static).
    #
    - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        dockerfile: ${{ inputs.context }}/Dockerfile
        failure-threshold: style
    #
    # Prepare the builder. QEMU is only required to emulate a platform that the
    # runner does not provide natively. Buildx is always set up so that all
    # build steps in this job share one builder and therefore one layer cache.
    #
    - name: Set up QEMU
      if: inputs.platforms != 'linux/amd64'
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    #
    # Only one image can be loaded into the docker image store, hence a single
    # platform is picked to lint, detect waste in and scan. linux/amd64 is
    # preferred as it requires no emulation. A consumer that wants every
    # architecture scanned runs this action in a matrix with one platform per
    # job, as each job then scans the platform that it builds.
    #
    - name: Determine the platform to scan
      id: platform
      shell: bash
      env:
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        read -ra platforms <<< "${PLATFORMS//,/ }"
        scan_platform="${platforms[0]}"
        if [[ " ${platforms[*]} " == *" linux/amd64 "* ]]; then
          scan_platform="linux/amd64"
        fi
        for platform in "${platforms[@]}"; do
          [[ "$platform" == "$scan_platform" ]] ||
            echo "::warning::platform ${platform} is built and pushed, but not scanned by Dockle, Dive and Grype"
        done
        echo "scan_platform=${scan_platform}" >> "$GITHUB_OUTPUT"
    #
    # Determine image name and tag.
    #
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        flavor: |
          latest=false
        images: ${{ inputs.images }}
    #
    # Build a docker image.
    #
    - name: Set build-args
      id: parse
      shell: bash
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        echo "inputs.build-args:"
        echo "$BUILD_ARGS"

        if [[ "$BUILD_ARGS" == *$'\n'* ]]; then
          echo "Detected multiline build-args"
          echo "build_args<<EOF" >> $GITHUB_OUTPUT
          echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "Detected single-line build-arg"
          echo "build_args=APPLICATION=$BUILD_ARGS" >> $GITHUB_OUTPUT
        fi
    #
    # Build, lint (dynamic), detect waste in and scan the image. Loading a non
    # native image is fine as Dockle, Dive and Grype inspect the layers and the
    # config, they never execute the image. steps.meta.outputs.tags is not used
    # as the local tag since it can be multiline.
    #
    - name: Build an image from a dockerfile
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        build-args: ${{ steps.parse.outputs.build_args }}
        context: ${{ inputs.context }}
        labels: ${{ steps.meta.outputs.labels }}
        load: true
        platforms: ${{ steps.platform.outputs.scan_platform }}
        push: false
        tags: mcvs-docker-action:scan
    #
    # Docker image linting (dynamic).
    #
    - uses: goodwithtech/dockle-action@e30e6af832aad6ea7dca2a248d31a85eab6dbd68 # v0.4.15
      with:
        image: mcvs-docker-action:scan
        # CIS-DI-0005: Enable Content trust for Docker as this cannot be
        # achieved in public GitHub runners.
        # CIS-DI-0006: Add HEALTHCHECK instruction to the container image as
        # the decision was made that this is up to the consumer of this action
        # to set a health check or not.
        ignore: CIS-DI-0005,CIS-DI-0006
        accept-key: ${{ inputs.dockle-accept-key }}
    #
    # Detect waste in the docker image.
    #
    - uses: docker://wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
      with:
        args: mcvs-docker-action:scan --ci --ci-config .dive-ci
    - name: Scan the image using Grype
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        grype-version: ${{ inputs.grype-version }}
        image: mcvs-docker-action:scan
        only-fixed: false
        output-format: table
        severity-cutoff: high
    #
    # Code security scanning. Architecture independent, hence it runs once.
    #
    - name: Scan the code using Grype
      uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
      with:
        grype-version: ${{ inputs.grype-version }}
        only-fixed: false
        output-format: table
        path: ${{ inputs.context }}
        severity-cutoff: high
    #
    # Log in to the container registry and push the image.
    #
    - name: Log in to GitHub Container Registry
      if: inputs.push-to-container-registry == 'ghcr'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Log in to Docker Hub
      if: inputs.push-to-container-registry == 'dockerhub'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}
    #
    # A multi architecture image cannot be stored in the local docker image
    # store, hence the manifest list is pushed by buildx instead of by
    # `docker push`. The layers have already been built by the steps above and
    # are reused from the shared builder cache.
    #
    # provenance is disabled to prevent that buildx adds attestation manifests
    # that are displayed as `unknown/unknown` entries in a container registry.
    #
    - name: Build and push the image
      if: |
        github.event_name == 'push' &&
        contains(github.ref, 'refs/tags/') &&
        inputs.push-to-container-registry != ''
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        build-args: ${{ steps.parse.outputs.build_args }}
        context: ${{ inputs.context }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.platforms }}
        provenance: false
        push: true
        tags: ${{ steps.meta.outputs.tags }}
