---
name: MCVS-docker-action
"on":
  pull_request:
permissions:
  contents: read
jobs:
  # the default, i.e. every platform in a single job. linux/amd64 is scanned.
  MCVS-docker-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          context: test
          platforms: linux/amd64,linux/arm64
          push-to-container-registry: ""
  # a single, non-native platform, i.e. the scan falls back to the first entry
  # and the tools read an emulated image.
  MCVS-docker-action-single-platform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          context: test
          platforms: linux/arm64
          push-to-container-registry: ""
