---
name: MCVS-docker-action
"on":
  pull_request:
permissions:
  contents: read
jobs:
  # the default, i.e. every platform in a single job
  MCVS-docker-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          context: test
          platforms: linux/amd64,linux/arm64
          push-to-container-registry: ""
  # one job per platform, which is what the documented matrix relies on. Each
  # job has to scan the platform that it builds, hence linux/arm64 is scanned
  # here while the job above scans linux/amd64.
  MCVS-docker-action-per-platform:
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          context: test
          platforms: ${{ matrix.platform }}
          push-to-container-registry: ""
