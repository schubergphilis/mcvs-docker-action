# yamllint disable rule:line-length
# yamllint disable rule:quoted-strings
---
name: MCVS-docker-action-merge
description: |
  Combine the images that the MCVS-docker-action has pushed by digest into a
  single manifest list. Run this in a job that needs the jobs which have run
  the MCVS-docker-action with `push-by-digest: "true"`, and gate that job with
  `if: startsWith(github.ref, 'refs/tags/')` as the images are only pushed for
  a tagged release.
inputs:
  images:
    description: The name of the created image.
    default: ghcr.io/${{ github.repository }}
  dockerhub-username:
    description: |
      Docker Hub username. Required when push-to-container-registry is set to
      'dockerhub'.
  dockerhub-token:
    description: |
      Docker Hub access token. Required when push-to-container-registry is set
      to 'dockerhub'.
  push-to-container-registry:
    description: |
      Specify the container registry to which the manifest list must be pushed.
      Set the value to: 'ghcr' for GitHub Container Registry, 'dockerhub' for
      Docker Hub, or '' to disable pushing to a container registry.
    default: ghcr
  token:
    description: |
      A token is required to allow the mcvs-docker-action to push the manifest
      list to the packages repository of the GitHub repository where the action
      has been run.
runs:
  using: "composite"
  steps:
    #
    # Collect the digest of every platform that has been built.
    #
    - name: Download the digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
        path: ${{ runner.temp }}/digests
        pattern: mcvs-docker-action-digest-*
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    #
    # The same metadata configuration as the mcvs-docker-action, so that the
    # manifest list ends up with the tags that the image would have had if it
    # had been built in a single job.
    #
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        flavor: |
          latest=false
        images: ${{ inputs.images }}
    #
    # Log in to the container registry and push the manifest list.
    #
    - name: Log in to GitHub Container Registry
      if: inputs.push-to-container-registry == 'ghcr'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Log in to Docker Hub
      if: inputs.push-to-container-registry == 'dockerhub'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}
    - name: Create the manifest list and push it
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        METADATA: ${{ steps.meta.outputs.json }}
        VERSION: ${{ steps.meta.outputs.version }}
      working-directory: ${{ runner.temp }}/digests
      run: |
        shopt -s nullglob
        digests=(*)
        if [[ ${#digests[@]} -eq 0 ]]; then
          echo "::error::no digests found, did the build jobs run with push-by-digest?"
          exit 1
        fi
        references=("${digests[@]/#/${IMAGES}@sha256:}")

        mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$METADATA")

        docker buildx imagetools create "${tags[@]}" "${references[@]}"
        docker buildx imagetools inspect "${IMAGES}:${VERSION}"
